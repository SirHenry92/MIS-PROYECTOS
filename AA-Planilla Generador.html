<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Asientos SAP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <style>
        :root {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --primary-light: #EEF2FF;
            --bg: #F1F5F9;
            --surface: #FFFFFF;
            --surface-alt: #F8FAFC;
            --text: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --border-strong: #CBD5E1;
            --success: #10B981;
            --success-hover: #059669;
            --success-light: #ECFDF5;
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --danger-light: #FEF2F2;
            --info: #3B82F6;
            --info-hover: #2563EB;
            --info-light: #EFF6FF;
            --warning: #F59E0B;
            --warning-light: #FFFBEB;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 7px;
            --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
            --shadow-md: 0 8px 24px -8px rgba(15,23,42,0.18);
            --shadow-lg: 0 20px 45px -12px rgba(15,23,42,0.25);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        /* PANTALLA DE CARGA */
        #uploadScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;
            background:
                radial-gradient(circle at 15% 20%, rgba(99,102,241,0.12), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(16,185,129,0.10), transparent 45%),
                var(--bg);
        }
        .upload-card {
            background: var(--surface); padding: 40px 36px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
            max-width: 440px; width: 90%; text-align: center; border: 1px solid var(--border);
        }
        .upload-icon {
            width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px;
            background: linear-gradient(135deg, var(--primary), #8B5CF6);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; box-shadow: 0 10px 24px -8px rgba(99,102,241,0.55);
        }
        .upload-card h2 { margin-top: 0; font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.01em; }
        .upload-card .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 26px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { font-weight: 600; font-size: 12.5px; color: var(--text-muted); display: block; margin-bottom: 7px; letter-spacing: 0.01em; }
        input[type="file"] {
            width: 100%; padding: 14px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md);
            font-size: 13px; background: var(--surface-alt); box-sizing: border-box; cursor: pointer; color: var(--text-muted);
            transition: border-color .15s, background .15s;
        }
        input[type="file"]:hover { border-color: var(--primary); background: var(--primary-light); }
        input[type="password"], input[type="text"], input[type="number"], select {
            width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-md);
            font-size: 13px; font-family: inherit; background: var(--surface); color: var(--text); transition: border-color .15s, box-shadow .15s;
        }
        input[type="password"]:focus, input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* WORKSPACE (DASHBOARD) */
        #dashboardScreen {
            display: none; height: 100vh; flex-direction: column; padding: 16px 20px; box-sizing: border-box; gap: 12px;
        }
        .dash-header { display: flex; justify-content: space-between; align-items: center; }
        .dash-header h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
        .dash-header h3::before {
            content: ""; width: 9px; height: 9px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #8B5CF6); display: inline-block;
        }

        /* BOTONES */
        .btn {
            background-color: var(--primary); color: white; border: none; padding: 8px 16px;
            border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 12.5px; transition: transform .1s, background .15s, box-shadow .15s;
            box-shadow: var(--shadow-sm); font-family: inherit; letter-spacing: 0.01em;
        }
        .btn:hover { background-color: var(--primary-hover); box-shadow: var(--shadow-md); }
        .btn:active { transform: translateY(1px); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-info { background-color: var(--info); }
        .btn-info:hover { background-color: var(--info-hover); }
        .btn-outline { background: var(--surface); border: 1.5px solid var(--border); color: var(--text-muted); box-shadow: none; }
        .btn-outline:hover { background: var(--surface-alt); border-color: var(--border-strong); color: var(--text); box-shadow: none; }
        .btn-sm { padding: 6px 12px; font-size: 11.5px; }

        /* PESTAÑAS (TABS) — segmented pill control */
        .tabs-header {
            display: flex; gap: 4px; padding: 4px; background: var(--surface-alt);
            border: 1px solid var(--border); border-radius: var(--radius-md); width: fit-content;
        }
        .tab-btn {
            background: transparent; border: none;
            padding: 7px 18px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600;
            font-size: 12.5px; color: var(--text-muted); transition: all .15s;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }
        .tab-content {
            display: none; flex-direction: column; flex-grow: 1; overflow: hidden;
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }
        .tab-content.active { display: flex; }

        /* BARRA DE TOTALES */
        .totals-bar {
            display: flex; justify-content: space-between; align-items: center; background: var(--surface-alt);
            padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap;
        }
        .totals-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .stat-chip {
            display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border);
            padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--text-muted);
        }
        .stat-chip .stat-value { color: var(--text); font-variant-numeric: tabular-nums; }
        .stat-chip.stat-ok .stat-value { color: var(--success); }
        .stat-chip.stat-bad .stat-value { color: var(--danger); }

        /* TABLA AJUSTADA A PANTALLA */
        .table-responsive { flex-grow: 1; overflow-y: auto; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; table-layout: auto; white-space: normal; font-variant-numeric: tabular-nums; }
        th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: 12px; word-wrap: break-word; }
        th { background-color: var(--surface-alt); color: var(--text-muted); position: sticky; top: 0; z-index: 10; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--border); box-shadow: 0 1px 0 var(--border); }
        .col-index { width: 34px; text-align: center; font-weight: 600; color: var(--text-muted); background: var(--surface-alt); font-size: 11px; }
        tbody tr:nth-child(even) td { background-color: var(--surface-alt); }
        tbody tr:hover td { background-color: var(--primary-light); }
        td[contenteditable="true"]:hover { background-color: var(--warning-light); cursor: text; outline: 1.5px solid var(--primary); outline-offset: -1.5px; }

        .col-filter {
            width: 100%; box-sizing: border-box; font-size: 11px; padding: 5px 8px; margin-top: 6px;
            border: 1px solid var(--border); border-radius: 6px; font-weight: 400; text-transform: none;
            letter-spacing: normal; background: var(--surface); color: var(--text);
        }
        .col-filter:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
        .col-filter::placeholder { color: #94A3B8; }
        th .th-label { display: block; margin-bottom: 2px; }

        /* SELECTOR DE COLUMNAS (DESCUENTOS) */
        .col-picker { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
        .col-chip {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
            border: 1.5px solid var(--border); background: var(--surface-alt); color: var(--text-muted);
            font-size: 11.5px; font-weight: 600; cursor: pointer; user-select: none; transition: all .12s;
        }
        .col-chip:hover { border-color: var(--border-strong); }
        .col-chip.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary-hover); }
        .col-chip input { display: none; }
        .col-picker-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }
        .col-picker-hint { font-size: 11px; color: var(--text-muted); padding: 0 16px 10px; }

        /* MODAL WIDGET TXT */
        #txtModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(2px); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--surface); padding: 26px; border-radius: var(--radius-lg); width: 320px; text-align: center;
            box-shadow: var(--shadow-lg); border: 1px solid var(--border);
        }
        .modal-content h4 { margin-top: 0; color: var(--text); font-size: 16px; font-weight: 700; margin-bottom: 18px; }
        .modal-content select, .modal-content input { margin-bottom: 15px; }
        .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; }
        .modal-actions button { flex: 1; }
    </style>
</head>
<body>

<!-- PANTALLA DE CARGA -->
<div id="uploadScreen">
    <div class="upload-card">
        <div class="upload-icon">📊</div>
        <h2>Análisis de Asientos Contables</h2>
        <p class="subtitle">Sube el archivo de planilla para generar los asientos SAP</p>
        <div class="form-group">
            <label>Archivo Base (.xlsx)</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
        </div>
        <div class="form-group">
            <label>Contraseña (solo si el archivo está protegido)</label>
            <input type="password" id="filePassword" placeholder="Dejar en blanco si no tiene contraseña">
        </div>
        <button class="btn" id="btnProcess" style="width: 100%; padding: 12px; font-size: 13.5px;">Procesar Tablas</button>
    </div>
</div>

<!-- WORKSPACE -->
<div id="dashboardScreen">
    <div class="dash-header">
        <h3>Workspace · Análisis de Asientos</h3>
        <button class="btn btn-outline" id="btnBack">Cargar otro archivo</button>
    </div>

    <div id="tabsHeader" class="tabs-header"></div>
    <div id="tabsBody" style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden;"></div>
</div>

<!-- WIDGET MODAL -->
<div id="txtModal">
    <div class="modal-content">
        <h4>Parámetros SAP</h4>
        <div style="text-align: left;">
            <label>Mes de Contabilización:</label>
            <select id="txtMonth">
                <option value="1">ENERO</option><option value="2">FEBRERO</option><option value="3">MARZO</option>
                <option value="4">ABRIL</option><option value="5">MAYO</option><option value="6">JUNIO</option>
                <option value="7">JULIO</option><option value="8">AGOSTO</option><option value="9">SEPTIEMBRE</option>
                <option value="10">OCTUBRE</option><option value="11">NOVIEMBRE</option><option value="12">DICIEMBRE</option>
            </select>
            <label>Año:</label>
            <input type="number" id="txtYear" value="2026" min="2020" max="2100">
        </div>
        
        <div class="modal-actions">
            <button class="btn btn-outline" id="btnCancelModal">Cancelar</button>
            <button class="btn btn-success" id="btnConfirmExport">Generar TXT</button>
        </div>
    </div>
</div>

<script>
    const uploadScreen = document.getElementById('uploadScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const txtModal = document.getElementById('txtModal');
    let currentExportTitle = "";

    const COLS = ["Cuenta Contable", "CTA", "DEBE", "HABER", "Naturaleza de Costo/Gasto", "Línea de Producción Costo/Gasto", "Proceso/Area de Costo/Gasto", "APELLIDOS Y NOMBRES", "Concepto de Control"];

    document.getElementById('btnBack').addEventListener('click', () => {
        dashboardScreen.style.display = 'none'; uploadScreen.style.display = 'flex';
        document.getElementById('excelFile').value = '';
    });

    document.getElementById('btnCancelModal').addEventListener('click', () => { txtModal.style.display = 'none'; });

    document.getElementById('btnProcess').addEventListener('click', () => {
        const file = document.getElementById('excelFile').files[0];
        if (!file) return alert('Por favor selecciona un archivo.');
        const password = document.getElementById('filePassword').value;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                let dataBytes = new Uint8Array(e.target.result);
                const esCFB = dataBytes[0] === 0xD0 && dataBytes[1] === 0xCF && dataBytes[2] === 0x11 && dataBytes[3] === 0xE0;
                if (esCFB) {
                    if (!password) { alert('Este archivo está protegido con contraseña. Ingresa la contraseña para continuar.'); return; }
                    dataBytes = decryptAgileOfficeFile(dataBytes, password);
                }
                const workbook = XLSX.read(dataBytes, { type: 'array' });

                const tabsHeader = document.getElementById('tabsHeader');
                const tabsBody = document.getElementById('tabsBody');
                tabsHeader.innerHTML = ''; tabsBody.innerHTML = '';
                let isFirstTab = true; let validSheets = 0;

                const buildTab = (title, data) => {
                    if (data.length === 0) return;
                    validSheets++;
                    
                    const btn = document.createElement('button');
                    btn.className = 'tab-btn' + (isFirstTab ? ' active' : '');
                    btn.innerText = title;
                    tabsHeader.appendChild(btn);

                    const content = document.createElement('div');
                    content.className = 'tab-content' + (isFirstTab ? ' active' : '');
                    content.id = 'tab-' + title;

                    // Thead con correlativo
                    let theadHtml = "<tr><th class='col-index'>#</th>";
                    COLS.forEach((col, idx) => {
                        theadHtml += `<th><span class="th-label">${col}</span><input type="text" class="col-filter" data-col="${idx+1}" placeholder="Filtrar..."></th>`;
                    });
                    theadHtml += "</tr>";

                    let tbodyHtml = "";
                    data.forEach((row, rIndex) => {
                        tbodyHtml += "<tr>";
                        tbodyHtml += `<td class="col-index">${rIndex + 1}</td>`;
                        COLS.forEach(col => {
                            let val = row[col] !== null && row[col] !== undefined ? row[col] : "";
                            if (col === "CTA" && val !== "") val = parseInt(val) || val;
                            else if (typeof val === 'number') val = val.toFixed(2);
                            tbodyHtml += `<td contenteditable="true" data-colname="${col}">${val}</td>`;
                        });
                        tbodyHtml += "</tr>";
                    });

                    content.innerHTML = `
                        <div class="totals-bar">
                            <div class="totals-info">
                                <div class="stat-chip">DEBE <span class="tot-debe stat-value">0.00</span></div>
                                <div class="stat-chip">HABER <span class="tot-haber stat-value">0.00</span></div>
                                <div class="stat-chip stat-ok"><span class="tot-dif-label">Dif</span> <span class="tot-dif stat-value">0.00</span></div>
                                <button class="btn btn-info btn-sm btn-diagnostic">Diagnóstico de Cuadres</button>
                            </div>
                            <button class="btn btn-success btn-export-section">Generar SAP (${title})</button>
                        </div>
                        <div class="table-responsive">
                            <table id="table-${title}">
                                <thead>${theadHtml}</thead>
                                <tbody>${tbodyHtml}</tbody>
                            </table>
                        </div>
                    `;
                    tabsBody.appendChild(content);

                    // Actualización Rápida de Totales
                    const updateTotalsFast = () => {
                        const rows = content.querySelector('tbody').children;
                        let sumDebe = 0, sumHaber = 0;
                        for(let i = 0; i < rows.length; i++) {
                            let tr = rows[i];
                            if(tr.style.display !== 'none') {
                                sumDebe += parseFloat(tr.children[3].textContent) || 0;
                                sumHaber += parseFloat(tr.children[4].textContent) || 0;
                            }
                        }
                        content.querySelector('.tot-debe').innerText = sumDebe.toFixed(2);
                        content.querySelector('.tot-haber').innerText = sumHaber.toFixed(2);
                        let dif = Math.abs(sumDebe - sumHaber);
                        let difSpan = content.querySelector('.tot-dif');
                        difSpan.innerText = dif.toFixed(2);
                        const difChip = content.querySelector('.tot-dif').closest('.stat-chip');
                        difChip.classList.toggle('stat-ok', dif < 0.01);
                        difChip.classList.toggle('stat-bad', dif >= 0.01);
                    };
                    updateTotalsFast();
                    content.querySelector('tbody').addEventListener('input', updateTotalsFast);

                    // Filtros dinámicos
                    const filters = content.querySelectorAll('.col-filter');
                    let filterTimeout = null;
                    filters.forEach(filter => {
                        filter.addEventListener('keyup', () => {
                            clearTimeout(filterTimeout);
                            filterTimeout = setTimeout(() => {
                                const activeFilters = Array.from(filters).map(f => ({
                                    idx: parseInt(f.getAttribute('data-col')),
                                    val: f.value.trim().toUpperCase()
                                })).filter(f => f.val !== "");

                                const rows = content.querySelector('tbody').children;
                                for(let i = 0; i < rows.length; i++) {
                                    let tr = rows[i];
                                    let showRow = true;
                                    for(let j = 0; j < activeFilters.length; j++) {
                                        const f = activeFilters[j];
                                        if(!tr.children[f.idx].textContent.toUpperCase().includes(f.val)) {
                                            showRow = false; break;
                                        }
                                    }
                                    tr.style.display = showRow ? "" : "none";
                                }
                                updateTotalsFast();
                            }, 250); 
                        });
                    });

                    // Botón de Diagnóstico Inteligente (distinto por pestaña)
                    content.querySelector(`.btn-diagnostic`).addEventListener('click', () => {
                        const rows = content.querySelector('tbody').children;

                        if (title === 'LIQUIDACIONES') {
                            // Cuadre Debe = Haber agrupado por empleado
                            let grouped = {};
                            for(let i=0; i<rows.length; i++) {
                                let tr = rows[i];
                                let nombre = tr.children[8].textContent.trim();
                                let debe = parseFloat(tr.children[3].textContent) || 0;
                                let haber = parseFloat(tr.children[4].textContent) || 0;

                                if(!nombre) continue;
                                if(!grouped[nombre]) grouped[nombre] = {debe:0, haber:0};
                                grouped[nombre].debe += debe;
                                grouped[nombre].haber += haber;
                            }

                            let errores = [];
                            for(let nom in grouped) {
                                let diff = Math.abs(grouped[nom].debe - grouped[nom].haber);
                                if(diff > 0.01) {
                                    errores.push(`❌ ${nom} | Dif: ${diff.toFixed(2)} (Debe: ${grouped[nom].debe.toFixed(2)} - Haber: ${grouped[nom].haber.toFixed(2)})`);
                                }
                            }

                            if(errores.length > 0) {
                                alert(`Se encontraron ${errores.length} descuadres en ${title}:\n\n` + errores.join("\n"));
                            } else {
                                alert(`✅ ¡Perfecto! Todos los subtotales por empleado cuadran correctamente en ${title}.`);
                            }
                        } else {
                            // PRACTICANTES / PLANILLA: toda fila debe tener Cuenta Contable
                            let sinCuenta = [];
                            for(let i=0; i<rows.length; i++) {
                                let tr = rows[i];
                                let cuenta = tr.children[1].textContent.trim();
                                let nombre = tr.children[8].textContent.trim();
                                if(!cuenta || cuenta === 'null') {
                                    sinCuenta.push(`❌ Fila ${tr.children[0].textContent} | ${nombre || '(sin nombre)'}`);
                                }
                            }

                            if(sinCuenta.length > 0) {
                                alert(`Se encontraron ${sinCuenta.length} filas sin Cuenta Contable en ${title}:\n\n` + sinCuenta.join("\n"));
                            } else {
                                alert(`✅ ¡Perfecto! Todas las filas de ${title} tienen Cuenta Contable asignada.`);
                            }
                        }
                    });

                    // Navegación de Tabs
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                        btn.classList.add('active'); content.classList.add('active');
                    });

                    // Exportar
                    content.querySelector(`.btn-export-section`).addEventListener('click', () => {
                        currentExportTitle = title;
                        txtModal.style.display = 'flex';
                    });

                    isFirstTab = false;
                };

                // Pestaña DESCUENTOS: matriz filtrable por columnas, con totales dinámicos y exportación a Excel.
                const buildDescuentosTab = (descData) => {
                    if (!descData || descData.rows.length === 0) return;
                    validSheets++;
                    const title = 'DESCUENTOS';

                    const btn = document.createElement('button');
                    btn.className = 'tab-btn' + (isFirstTab ? ' active' : '');
                    btn.innerText = title;
                    tabsHeader.appendChild(btn);

                    const content = document.createElement('div');
                    content.className = 'tab-content' + (isFirstTab ? ' active' : '');
                    content.id = 'tab-' + title;

                    const chipsHtml = descData.discountCols.map(col =>
                        `<label class="col-chip active"><input type="checkbox" value="${col}" checked>${col}</label>`
                    ).join('');

                    content.innerHTML = `
                        <div class="col-picker">
                            ${chipsHtml}
                            <div class="col-picker-actions">
                                <button class="btn btn-outline btn-sm" id="btnDescSelAll">Todo</button>
                                <button class="btn btn-outline btn-sm" id="btnDescSelNone">Ninguno</button>
                                <button class="btn btn-success btn-sm" id="btnDescExport">Exportar Excel</button>
                            </div>

    // ------------------------------------------------------------------
    // FUNCIONES BASE DE MATEMÁTICA Y LÓGICA (CLON EXACTO M)
    // ------------------------------------------------------------------
    function assignDimsClass6(cta, procesoArea) {
        let ctatxt = cta ? cta.toString() : "";
        if (!ctatxt.startsWith("6")) return { nat: null, lin: null, proc: null };
        let proc = procesoArea ? procesoArea.toString() : null;
        if (!proc) return { nat: null, lin: null, proc: null };
        let nat = proc.substring(0, 1), prf = proc.substring(0, 2), lin = null;
        if (prf === "11") lin = "A11"; else if (prf === "21") lin = "V21"; 
        else if (["31","32","33"].includes(prf)) lin = "P" + prf; else if (["40","41","42","43"].includes(prf)) lin = "I" + prf;
        
        // REGLA: Si la Línea de Producción es nula/vacía, Proceso/Área también debe quedar vacío.
        if (!lin) proc = null;

        return { nat: nat, lin: lin, proc: proc };
    }

    function safeNum(val) { let n = parseFloat(val); return isNaN(n) ? 0 : n; }

    function fnCta_LIQ(cta, dni) {
        if (!cta) return null;
        let ctatxt = cta.toString().trim();
        let pref2 = ctatxt.substring(0, 2);
        let esAsociada = ["12","13","14","16","17","18","19","42","43","44","45","46","47"].includes(pref2);
        let noLlevaE = ["4017301", "4699101", "1412101", "1412201", "1411301"].includes(ctatxt) || ctatxt.startsWith("6");
        let dniVal = (dni !== null && dni !== undefined) ? dni.toString().trim() : "";
        
        if (esAsociada && !noLlevaE && dniVal !== "") {
            return "E" + dniVal;
        }
        return ctatxt;
    }

    function process_TB_liq(rows) {
        let results = [];
        let currentCC = null;
        
        for (let r of rows) {
            let numKey = Object.keys(r).find(k => k.trim().toUpperCase() === "Nº" || k.trim().toUpperCase() === "N°");
            let numVal = numKey && r[numKey] !== null ? r[numKey].toString().trim().toUpperCase() : null;

            if (numVal !== null && numVal.startsWith("CENTRO DE COSTOS")) {
                let parts = numVal.split(":");
                if (parts.length > 1) {
                    let ccExtraido = parts[1].trim().substring(0, 5);
                    currentCC = (ccExtraido === "40001") ? "40101" : ccExtraido;
                } else {
                    let match = numVal.match(/\d{5}/);
                    if(match) currentCC = (match[0] === "40001") ? "40101" : match[0];
                }
                continue;
            }

            let nombreOriginal = r["APELLIDOS Y NOMBRES"];
            let nomStr = nombreOriginal !== null && nombreOriginal !== undefined ? nombreOriginal.toString().trim().toUpperCase() : "";

            if (numVal === null || numVal === "" || numVal === "Nº" || numVal === "N°" || nomStr === "" || nomStr.startsWith("TOTAL")) {
                continue;
            }

            let catKey = Object.keys(r).find(k => k.toUpperCase().includes("CATEGORIA"));
            let categoria = catKey && r[catKey] ? r[catKey].toString().toUpperCase().trim() : "EMPLEADO";
            let doc = r["DOCUMENTO"];
            let isObrero = categoria === "OBRERO";

            const addLine = (ctaGastos, valDebe, valHaber, concepto) => {
                if (valDebe === 0 && valHaber === 0) return;
                let dims = assignDimsClass6(ctaGastos, currentCC);
                results.push({ 
                    "Cuenta Contable": fnCta_LIQ(ctaGastos, doc), 
                    "CTA": ctaGastos, 
                    "DEBE": valDebe, 
                    "HABER": valHaber, 
                    "Naturaleza de Costo/Gasto": dims.nat, 
                    "Línea de Producción Costo/Gasto": dims.lin, 
                    "Proceso/Area de Costo/Gasto": dims.proc, 
                    "APELLIDOS Y NOMBRES": nombreOriginal, 
                    "Concepto de Control": concepto 
                });
            };

            addLine(isObrero ? 6211201 : 6211101, safeNum(r["DIAS TRABAJADOS"]), 0, "DIAS TRABAJADOS");
            addLine(isObrero ? 6211201 : 6211101, safeNum(r["LICENCIA CON GOCE HABER"]), 0, "LICENCIA CON GOCE HABER");
            addLine(isObrero ? 6221201 : 6221101, safeNum(r["ASIG. FAM."]), 0, "ASIG. FAM.");
            addLine(isObrero ? 6225201 : 6225101, safeNum(r["HORAS EXTRAS 25%"]) + safeNum(r["HORAS EXTRAS 35%"]) + safeNum(r["H. E. 100%"]), 0, "HORAS EXTRAS");
            addLine(isObrero ? 6223201 : 6223101, safeNum(r["BONIFICACION NOCTURNA"]), 0, "BONIFICACION NOCTURNA");
            addLine(isObrero ? 6224201 : 6224101, safeNum(r["MOVILIDAD"]), 0, "MOVILIDAD");
            addLine(1629101, 0, safeNum(r["DIFERENCIA POR SUBSIDIO"]), "DIFERENCIA POR SUBSIDIO");
            addLine(1629101, safeNum(r["REINTEGRO SUBSIDIO"]), 0, "REINTEGRO SUBSIDIO");
            addLine(4114101, safeNum(r["BON. EXTRA. TEMPORAL"]), 0, "BON. EXTRA. TEMPORAL");
            addLine(4151101, safeNum(r["C.T.S. TRUNCO"]), 0, "C.T.S. TRUNCO");
            addLine(4115101, safeNum(r["VACACION TRUNCA"]), 0, "VACACION TRUNCA");
            addLine(4115101, safeNum(r["VACACIONES PENDIENTES"]), 0, "VACACIONES PENDIENTES");
            addLine(4114101, safeNum(r["GRAT. TRUNCA"]), 0, "GRAT. TRUNCA");
            addLine(isObrero ? 6271201 : 6271101, safeNum(r["ESSALUD - IMPORTE"]), 0, "ESSALUD GASTO");
            addLine(isObrero ? 6277103 : 6277102, safeNum(r["SENATI - IMPORTE"]), 0, "SENATI GASTO");
            addLine(4031101, 0, safeNum(r["ESSALUD - IMPORTE"]), "ESSALUD PASIVO");
            addLine(4033101, 0, safeNum(r["SENATI - IMPORTE"]), "SENATI PASIVO");
            addLine(4699101, 0, safeNum(r["RET.JUD."]), "RET.JUD.");
            addLine(1412101, 0, safeNum(r["ADEL. QUIN."]), "ADEL. QUIN.");
            addLine(1412201, 0, safeNum(r["VACACIONES ADELANTADAS"]), "VACACIONES ADELANTADAS");
            addLine(1412101, 0, safeNum(r["SOBREGIRO BOLETA NEGATIVA"]), "SOBREGIRO BOLETA NEGATIVA");
            addLine(1411301, 0, safeNum(r["PRESTAMO ESCOLAR"]) + safeNum(r["PRESTAMO ESCOLAR2"]), "PRESTAMO ESCOLAR");
            addLine(4699204, 0, safeNum(r["PRESTAMO BANCO COMERCIO"]) + safeNum(r["PRESTAMO BANCO COMERCIO2"]), "PRESTAMO BCO COMERCIO");
            addLine(4699802, 0, safeNum(r["DONACIÓN FUNDACIÓN ART AT"]), "DONACIÓN FUNDACIÓN ART AT");
            addLine(4032101, 0, safeNum(r["O.N.P."]), "O.N.P.");
            addLine(4171101, 0, safeNum(r["A.F.P. (10%)"]), "AFP FONDO");
            addLine(4171201, 0, safeNum(r["A.F.P. (PRM.SEG.)"]), "AFP PRIMA");
            addLine(4171301, 0, safeNum(r["A.F.P. (COM. VAR.)"]), "AFP COMISION");
            addLine(4159101, 0, safeNum(r["NETO A PAGAR"]), "NETO A PAGAR");
        }
        return results;
    }

    function process_TB_pra(rows) {
        let results = [];
        let sumAdelanto = 0, sumNeto = 0;
        for (let r of rows) {
            let agrup = r["AGRUPAMIENTO"];
            if (!agrup || agrup === "TOTAL") continue;
            let totIngresos = safeNum(r["TOTAL INGRESOS"]), credAnnthara = safeNum(r["CREDITO ANNTHARA"]);
            sumAdelanto += safeNum(r["ADEL. QUIN."]); sumNeto += safeNum(r["NETO A PAGAR"]);
            let t3 = null;
            let idx1 = agrup.indexOf(":"), idx2 = agrup.indexOf("-");
            if (idx1 !== -1 && idx2 !== -1 && idx2 > idx1) t3 = agrup.substring(idx1 + 1, idx2).trim();

            if (totIngresos !== 0) {
                let dims = assignDimsClass6(6211301, t3);
                results.push({ "Cuenta Contable": "6211301", "CTA": 6211301, "DEBE": totIngresos, "HABER": 0, "Naturaleza de Costo/Gasto": dims.nat, "Línea de Producción Costo/Gasto": dims.lin, "Proceso/Area de Costo/Gasto": dims.proc, "APELLIDOS Y NOMBRES": r["AGRUPAMIENTO"], "Concepto de Control": "TOTAL INGRESOS" });
            }
            if (credAnnthara !== 0) {
                let doc = r["DOCUMENTO"] ? r["DOCUMENTO"].toString().trim() : "";
                results.push({ "Cuenta Contable": (doc !== "" && doc !== "null") ? "4699901E" + doc : null, "CTA": 4699901, "DEBE": 0, "HABER": credAnnthara, "Naturaleza de Costo/Gasto": null, "Línea de Producción Costo/Gasto": null, "Proceso/Area de Costo/Gasto": null, "APELLIDOS Y NOMBRES": r["AGRUPAMIENTO"], "Concepto de Control": "CREDITO ANNTHARA" });
            }
        }
        if (sumAdelanto !== 0) results.push({ "Cuenta Contable": "1412101", "CTA": 1412101, "DEBE": 0, "HABER": sumAdelanto, "Naturaleza de Costo/Gasto": null, "Línea de Producción Costo/Gasto": null, "Proceso/Area de Costo/Gasto": null, "APELLIDOS Y NOMBRES": "TOTAL ADELANTOS QUINCENA", "Concepto de Control": "ADELANTO QUINCENA" });
        if (sumNeto !== 0) results.push({ "Cuenta Contable": "4191101", "CTA": 4191101, "DEBE": 0, "HABER": sumNeto, "Naturaleza de Costo/Gasto": null, "Línea de Producción Costo/Gasto": null, "Proceso/Area de Costo/Gasto": null, "APELLIDOS Y NOMBRES": "TOTAL NETO A PAGAR", "Concepto de Control": "NETO A PAGAR" });
        return results;
    }

    function fnCta_PLL(cta, dni) {
        if (!cta) return null;
        let ctatxt = cta.toString().trim(), pref2 = ctatxt.substring(0, 2), pref4 = ctatxt.substring(0, 4);
        let esCategoriaAsociada = ["12","13","14","16","17","19","42","43","44","45","46","47"].includes(pref2) || ["4171", "4031", "4032"].includes(pref4);
        let noEsAsociadaReal = ["4017301", "1411301", "1412101", "1412201", "4699101"].includes(ctatxt);
        if (esCategoriaAsociada && !noEsAsociadaReal && dni !== null && dni !== undefined && dni.toString().trim() !== "") return "E" + dni.toString().trim();
        return ctatxt;
    }

    function process_TB_pll(rows) {
        let base = [], index = 0;
        for (let r of rows) {
            let debe = safeNum(r["DEBE"]), haber = safeNum(r["HABER"]);
            if (debe === 0 && haber === 0) { index++; continue; }
            let a5 = (r["A5"] === undefined || r["A5"] === null) ? r["APELLIDOS Y NOMBRES"] : r["A5"];
            base.push({ CTA: r["CTA"] ? parseInt(r["CTA"]) : null, A3: (r["A3"] !== null && r["A3"] !== undefined) ? r["A3"].toString() : null, A4: (r["A4"] !== null && r["A4"] !== undefined) ? r["A4"].toString() : null, A5: (a5 !== null && a5 !== undefined) ? a5.toString() : null, DEBE: debe, HABER: haber, Columna8: r["Columna8"] !== undefined && r["Columna8"] !== null ? parseFloat(r["Columna8"]) : null, OrdenOriginal: index });
            index++;
        }
        let CuentasCtrl = [1629101, 4699802, 4699202, 4699204, 1413101, 1419103, 4699803, 4699807, 1412201, 4115101, 4699101, 4017301, 1411301, 4699806, 1419102];
        const groupBy = (array, keys) => {
            let map = new Map();
            array.forEach(item => {
                let keyStr = keys.map(k => item[k]).join("|");
                if (!map.has(keyStr)) { let obj = {}; keys.forEach(k => obj[k] = item[k]); obj.DEBE = 0; obj.HABER = 0; obj.OrdenOriginal = item.OrdenOriginal; map.set(keyStr, obj); }
                let grouped = map.get(keyStr); grouped.DEBE += item.DEBE; grouped.HABER += item.HABER;
                if (item.OrdenOriginal < grouped.OrdenOriginal) grouped.OrdenOriginal = item.OrdenOriginal;
            });
            return Array.from(map.values());
        };
        let controlables = base.filter(r => CuentasCtrl.includes(r.CTA));
        let resCtrl = groupBy(controlables, ["CTA", "A3", "A4", "A5"]).map(r => ({ ...r, "Cuenta Contable": fnCta_PLL(r.CTA, r.A4) }));

        let mix = base.filter(r => r.CTA === 1412101);
        let resMix = [];
        if (mix.length > 0) {
            let lastVal = null;
            for (let i = mix.length - 1; i >= 0; i--) { if (mix[i].Columna8 !== null) { lastVal = mix[i].Columna8; } else { mix[i].Columna8 = lastVal; } }
            let maxCol8 = Math.max(...mix.map(r => r.Columna8 === null ? -99999999 : r.Columna8));
            let agpMix = groupBy(mix.filter(r => r.Columna8 === maxCol8), ["CTA", "A3"]);
            let agrupadoEst = agpMix.map(r => ({ CTA: r.CTA, A3: r.A3, DEBE: r.DEBE, HABER: r.HABER, OrdenOriginal: r.OrdenOriginal, A4: null, A5: "NETO 1412101" }));
            let detalleEst = mix.filter(r => r.Columna8 !== maxCol8).map(r => ({ CTA: r.CTA, A3: r.A3, DEBE: r.DEBE, HABER: r.HABER, A4: r.A4, A5: r.A5, OrdenOriginal: r.OrdenOriginal }));
            resMix = agrupadoEst.concat(detalleEst).map(r => ({ ...r, "Cuenta Contable": fnCta_PLL(r.CTA, r.A4) }));
        }

        let confidenciales = base.filter(r => !CuentasCtrl.includes(r.CTA) && r.CTA !== 1412101);
        let resConf = groupBy(confidenciales, ["CTA", "A3"]).map(r => ({ ...r, A4: null, A5: null, "Cuenta Contable": fnCta_PLL(r.CTA, null) }));

        let union = [...resCtrl, ...resMix, ...resConf].filter(r => !( (r.DEBE === null || r.DEBE === 0) && (r.HABER === null || r.HABER === 0) ));
        union.sort((a, b) => a.OrdenOriginal - b.OrdenOriginal);

        return union.map(r => {
            let nat = null, lin = null, proc = null;
            if (r.CTA && r.CTA.toString().startsWith("6")) {
                let t3 = (r.A3 && r.A3.length > 1) ? r.A3.substring(1) : null;
                if (t3) { 
                    nat = t3.substring(0, 1); 
                    let prf = t3.substring(0, 2); 
                    if (prf === "11") lin = "A11"; 
                    else if (prf === "21") lin = "V21"; 
                    else if (["31","32","33"].includes(prf)) lin = "P" + prf; 
                    else if (["40","41","42","43"].includes(prf)) lin = "I" + prf; 
                    
                    proc = lin ? t3 : null; 
                }
            }
            return { "Cuenta Contable": r["Cuenta Contable"], "CTA": r.CTA, "DEBE": r.DEBE || 0, "HABER": r.HABER || 0, "Naturaleza de Costo/Gasto": nat, "Línea de Producción Costo/Gasto": lin, "Proceso/Area de Costo/Gasto": proc, "APELLIDOS Y NOMBRES": r.A5, "Concepto de Control": null };
        });
    }

    // ------------------------------------------------------------------
    // LECTURA DIRECTA DEL ARCHIVO ORIGEN (sin tablas LIQ/PRA/PLL previas)
    // Mapea las hojas crudas (LIQUIDACIONES, PRACTICANTES, ASTO OK) a la
    // misma forma que ya consumen process_TB_liq / process_TB_pra / process_TB_pll.
    // ------------------------------------------------------------------
    function buildCategoriaMap(workbook) {
        const sheet = workbook.Sheets['PREVIO'];
        if (!sheet) return {};
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: null, range: 2 });
        const map = {};
        rows.forEach(r => {
            const codigo = r['CODIGO TRABAJ'];
            const codCcto = r['COD_CCTO'];
            if (codigo && codCcto) {
                const prefix = codCcto.toString().trim().charAt(0).toUpperCase();
                map[codigo.toString().trim()] = prefix === 'O' ? 'OBRERO' : 'EMPLEADO';
            }
        });
        return map;
    }

    function extractLIQFromSource(workbook, categoriaMap) {
        const sheet = workbook.Sheets['LIQUIDACIONES'];
        if (!sheet) return [];
        const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, range: 5, defval: null });
        const header = raw[0];
        const dataRows = raw.slice(1);
        return dataRows.map(arr => {
            const obj = {};
            let dupSeen = false;
            header.forEach((h, idx) => {
                if (h === null) return;
                let key = h.toString().trim();
                if (key === 'PRESTAMO ESCOLAR') {
                    if (dupSeen) key = 'PRESTAMO ESCOLAR2'; else dupSeen = true;
                }
                obj[key] = arr[idx] !== undefined ? arr[idx] : null;
            });
            const codigo = obj['CODIGO'] ? obj['CODIGO'].toString().trim() : null;
            obj['CATEGORIA'] = (codigo && categoriaMap[codigo]) ? categoriaMap[codigo] : 'EMPLEADO';
            return obj;
        });
    }

    function extractPRAFromSource(workbook) {
        const sheet = workbook.Sheets['PRACTICANTES'];
        if (!sheet) return [];
        return XLSX.utils.sheet_to_json(sheet, { range: 5, defval: null });
    }

    function extractPLLFromSource(workbook) {
        const sheet = workbook.Sheets['ASTO OK'];
        if (!sheet) return [];
        const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
        return raw.slice(2)
            .filter(arr => arr[1] !== null && arr[1] !== undefined && arr[1] !== '')
            .map(arr => ({ CTA: arr[1], A3: arr[4], A4: arr[7], A5: arr[8], DEBE: arr[5], HABER: arr[6], Columna8: arr[13] }));
    }

    // Hoja DESCUENTOS: matriz de trabajador x tipo de descuento, con encabezados
    // duplicados en el archivo origen (se desambiguan con sufijo " (2)").
    function extractDescuentosFromSource(workbook) {
        const sheet = workbook.Sheets['DESCUENTOS'];
        if (!sheet) return null;
        const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, range: 5, defval: null });
        const header = raw[0];
        const dataRows = raw.slice(1);

        const seen = {};
        const colNames = header.map(h => {
            if (h === null || h === undefined || h.toString().trim() === '') return null;
            let key = h.toString().trim();
            seen[key] = (seen[key] || 0) + 1;
            if (seen[key] > 1) key = `${key} (${seen[key]})`;
            return key;
        });

        const identityCols = ['Nº', 'T.DOC', 'DOCUMENTO', 'APELLIDOS Y NOMBRES'];
        const discountCols = colNames.filter(name => name && !identityCols.includes(name) && name !== 'TOTAL DESCUENTOS');

        const rows = [];
        dataRows.forEach(arr => {
            const nombre = arr[3];
            if (!nombre || nombre.toString().trim() === '') return; // salta fila TOTAL / vacías
            const row = {};
            colNames.forEach((name, idx) => { if (name) row[name] = arr[idx]; });
            rows.push(row);
        });

        // Título superior de la hoja original (filas 2 y 3, ej. "DETALLE DE PLANILLA
        // MENSUAL" / "TODOS LOS TIPOS DE PERSONAL - JUNIO 2026"), para replicarlo al exportar.
        const titleLine1 = (sheet['A2'] && sheet['A2'].v) ? sheet['A2'].v.toString() : 'DETALLE DE PLANILLA MENSUAL';
        const titleLine2 = (sheet['A3'] && sheet['A3'].v) ? sheet['A3'].v.toString() : '';

        return { identityCols, discountCols, rows, titleLine1, titleLine2 };
    }

    // ------------------------------------------------------------------
    // EXPORTACIÓN CON ESTILO DE LA PESTAÑA DESCUENTOS (ExcelJS)
    // Replica el look de la hoja DESCUENTOS original: encabezado en negrita
    // con relleno naranja claro, bordes finos, fuente Calibri 8pt y formato
    // de número con separador de miles (rojo para negativos).
    // ------------------------------------------------------------------
    const HEADER_FILL = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFDE9D9' } };
    const THIN_BORDER = { style: 'thin', color: { argb: 'FFBFBFBF' } };
    const ALL_BORDERS = { top: THIN_BORDER, bottom: THIN_BORDER, left: THIN_BORDER, right: THIN_BORDER };
    const NUM_FMT = '#,##0.00_);[Red](#,##0.00)';

    async function exportDescuentosStyled(state, filename) {
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('DESCUENTOS', { views: [{ state: 'frozen', ySplit: 4 }] });

        const headers = ['DOCUMENTO', 'APELLIDOS Y NOMBRES', ...state.visibleCols, 'TOTAL'];
        const IDENTITY_COUNT = 2; // DOCUMENTO, APELLIDOS Y NOMBRES
        ws.columns = headers.map(h => ({
            width: h === 'APELLIDOS Y NOMBRES' ? 34 : (h === 'DOCUMENTO' ? 13 : Math.max(12, Math.min(h.length + 4, 22))),
        }));
        const lastColLetter = ws.getColumn(headers.length).letter;

        // Fila 1: título superior (ej. "DETALLE DE PLANILLA MENSUAL")
        ws.addRow([state.titleLine1 || 'DETALLE DE PLANILLA MENSUAL']);
        ws.mergeCells(`A1:${lastColLetter}1`);
        ws.getCell('A1').font = { name: 'Calibri', size: 11, bold: true };
        ws.getCell('A1').alignment = { horizontal: 'center', vertical: 'middle' };
        ws.getRow(1).height = 20;

        // Fila 2: subtítulo (ej. "TODOS LOS TIPOS DE PERSONAL - JUNIO 2026")
        ws.addRow([state.titleLine2 || '']);
        ws.mergeCells(`A2:${lastColLetter}2`);
        ws.getCell('A2').font = { name: 'Calibri', size: 9, bold: true };
        ws.getCell('A2').alignment = { horizontal: 'center', vertical: 'middle' };

        // Fila 3: "RESUMEN TOTAL DE PLANILLLAS" (bloque identidad) + "DESCUENTOS DEL TRABAJADOR" (bloque de columnas)
        ws.addRow(['RESUMEN TOTAL DE PLANILLLAS']);
        ws.mergeCells(`A3:${ws.getColumn(IDENTITY_COUNT).letter}3`);
        ws.getCell('A3').font = { name: 'Calibri', size: 8, bold: true };
        if (headers.length > IDENTITY_COUNT) {
            const startLetter = ws.getColumn(IDENTITY_COUNT + 1).letter;
            ws.mergeCells(`${startLetter}3:${lastColLetter}3`);
            const labelCell = ws.getCell(`${startLetter}3`);
            labelCell.value = 'DESCUENTOS DEL TRABAJADOR';
            labelCell.font = { name: 'Calibri', size: 9, bold: true };
            labelCell.fill = HEADER_FILL;
            labelCell.border = ALL_BORDERS;
            labelCell.alignment = { horizontal: 'center', vertical: 'middle' };
        }

        // Fila 4: encabezados de columna
        const headerRow = ws.addRow(headers);
        headerRow.eachCell(cell => {
            cell.font = { name: 'Calibri', size: 9, bold: true };
            cell.fill = HEADER_FILL;
            cell.border = ALL_BORDERS;
            cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        });
        headerRow.height = 28;

        state.visibleRows.forEach(x => {
            const rowVals = [x.r['DOCUMENTO'] ?? '', x.r['APELLIDOS Y NOMBRES'] ?? ''];
            state.visibleCols.forEach(c => rowVals.push(parseFloat(x.r[c]) || 0));
            rowVals.push(Math.round(x.total * 100) / 100);
            const row = ws.addRow(rowVals);
            row.eachCell((cell, colNum) => {
                cell.font = { name: 'Calibri', size: 8 };
                cell.border = ALL_BORDERS;
                if (colNum > 2) { cell.numFmt = NUM_FMT; cell.alignment = { horizontal: 'right' }; }
            });
        });

        const totalsVals = ['', 'TOTALES'];
        state.visibleCols.forEach(c => totalsVals.push(Math.round(state.colTotals[c] * 100) / 100));
        totalsVals.push(Math.round(state.grandTotal * 100) / 100);
        const totalsRow = ws.addRow(totalsVals);
        totalsRow.eachCell((cell, colNum) => {
            cell.font = { name: 'Calibri', size: 8.5, bold: true };
            cell.fill = HEADER_FILL;
            cell.border = ALL_BORDERS;
            if (colNum > 2) { cell.numFmt = NUM_FMT; cell.alignment = { horizontal: 'right' }; }
        });

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    }

    // ------------------------------------------------------------------
    // DESCIFRADO EN NAVEGADOR DE ARCHIVOS .XLSX PROTEGIDOS CON CONTRASEÑA
    // (Cifrado "Agile" ECMA-376 / MS-OFFCRYPTO, usado por Excel moderno)
    // ------------------------------------------------------------------
    function toUint8(x) { return x instanceof Uint8Array ? x : new Uint8Array(x); }
    function b64ToUint8(str) {
        const bin = atob(str);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
    }
    function concatUint8(...arrs) {
        const len = arrs.reduce((a, b) => a + b.length, 0);
        const out = new Uint8Array(len);
        let off = 0;
        for (const a of arrs) { out.set(a, off); off += a.length; }
        return out;
    }
    function le32(n) { return new Uint8Array([n & 0xff, (n >>> 8) & 0xff, (n >>> 16) & 0xff, (n >>> 24) & 0xff]); }
    function waFromUint8(u8) { return CryptoJS.lib.WordArray.create(u8); }
    function uint8FromWA(wordArray) {
        const { words, sigBytes } = wordArray;
        const u8 = new Uint8Array(sigBytes);
        for (let i = 0; i < sigBytes; i++) u8[i] = (words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
        return u8;
    }
    function sha512(buf) { return uint8FromWA(CryptoJS.SHA512(waFromUint8(buf))); }
    function aesCbcDecryptNoPad(keyBytes, ivBytes, cipherBytes) {
        const cipherParams = CryptoJS.lib.CipherParams.create({ ciphertext: waFromUint8(cipherBytes) });
        const decrypted = CryptoJS.AES.decrypt(cipherParams, waFromUint8(keyBytes), { iv: waFromUint8(ivBytes), mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.NoPadding });
        return uint8FromWA(decrypted);
    }
    function passwordToUtf16LE(pw) {
        const bytes = new Uint8Array(pw.length * 2);
        for (let i = 0; i < pw.length; i++) {
            const code = pw.charCodeAt(i);
            bytes[i * 2] = code & 0xff;
            bytes[i * 2 + 1] = (code >> 8) & 0xff;
        }
        return bytes;
    }
    function deriveKey(password, salt, spinCount, blockKey, keyBytesLen) {
        let h = sha512(concatUint8(salt, passwordToUtf16LE(password)));
        for (let i = 0; i < spinCount; i++) h = sha512(concatUint8(le32(i), h));
        h = sha512(concatUint8(h, blockKey));
        if (h.length < keyBytesLen) {
            const padded = new Uint8Array(keyBytesLen);
            padded.set(h);
            for (let i = h.length; i < keyBytesLen; i++) padded[i] = 0x36;
            h = padded;
        } else {
            h = h.slice(0, keyBytesLen);
        }
        return h;
    }

    const BLOCK_KEY_VERIFIER_INPUT = new Uint8Array([0xfe, 0xa7, 0xd2, 0x76, 0x3b, 0x4b, 0x9e, 0x79]);
    const BLOCK_KEY_VERIFIER_VALUE = new Uint8Array([0xd7, 0xaa, 0x0f, 0x6d, 0x30, 0x61, 0x34, 0x4e]);
    const BLOCK_KEY_KEY_VALUE = new Uint8Array([0x14, 0x6e, 0x0b, 0xe7, 0xab, 0xac, 0xd0, 0xd6]);

    function decryptAgileOfficeFile(fileBytes, password) {
        const cfb = XLSX.CFB.read(fileBytes, { type: 'array' });
        const encInfoEntry = XLSX.CFB.find(cfb, 'EncryptionInfo');
        const encPkgEntry = XLSX.CFB.find(cfb, 'EncryptedPackage');
        if (!encInfoEntry || !encPkgEntry) throw new Error('El archivo no tiene el formato de cifrado esperado (EncryptionInfo/EncryptedPackage no encontrados).');

        const encInfoBytes = toUint8(encInfoEntry.content);
        const xmlStr = new TextDecoder('utf-8').decode(encInfoBytes.slice(8));
        const doc = new DOMParser().parseFromString(xmlStr, 'application/xml');
        const keyDataEl = doc.getElementsByTagName('keyData')[0];
        const keyEncEl = doc.getElementsByTagName('p:encryptedKey')[0] || doc.getElementsByTagName('encryptedKey')[0];
        if (!keyDataEl || !keyEncEl) throw new Error('Este archivo usa un tipo de cifrado no soportado (se esperaba cifrado "Agile").');

        const keyDataSalt = b64ToUint8(keyDataEl.getAttribute('saltValue'));
        const keyDataBlockSize = parseInt(keyDataEl.getAttribute('blockSize'));

        const spinCount = parseInt(keyEncEl.getAttribute('spinCount'));
        const pwSalt = b64ToUint8(keyEncEl.getAttribute('saltValue'));
        const encVerifierHashInput = b64ToUint8(keyEncEl.getAttribute('encryptedVerifierHashInput'));
        const encVerifierHashValue = b64ToUint8(keyEncEl.getAttribute('encryptedVerifierHashValue'));
        const encKeyValue = b64ToUint8(keyEncEl.getAttribute('encryptedKeyValue'));
        const keyBytesLen = parseInt(keyEncEl.getAttribute('keyBits')) / 8;

        const verifierInputKey = deriveKey(password, pwSalt, spinCount, BLOCK_KEY_VERIFIER_INPUT, keyBytesLen);
        const verifierValueKey = deriveKey(password, pwSalt, spinCount, BLOCK_KEY_VERIFIER_VALUE, keyBytesLen);
        const keyValueKey = deriveKey(password, pwSalt, spinCount, BLOCK_KEY_KEY_VALUE, keyBytesLen);

        const verifierHashInput = aesCbcDecryptNoPad(verifierInputKey, pwSalt, encVerifierHashInput);
        const verifierHashInputHash = sha512(verifierHashInput);
        const verifierHashValue = aesCbcDecryptNoPad(verifierValueKey, pwSalt, encVerifierHashValue);

        let match = verifierHashValue.length <= verifierHashInputHash.length;
        if (match) {
            for (let i = 0; i < verifierHashValue.length; i++) {
                if (verifierHashInputHash[i] !== verifierHashValue[i]) { match = false; break; }
            }
        }
        if (!match) throw new Error('Contraseña incorrecta.');

        const secretKey = aesCbcDecryptNoPad(keyValueKey, pwSalt, encKeyValue);

        const pkgBytes = toUint8(encPkgEntry.content);
        const view = new DataView(pkgBytes.buffer, pkgBytes.byteOffset, pkgBytes.byteLength);
        const totalSize = view.getUint32(0, true);
        const encryptedData = pkgBytes.slice(8);

        const SEGMENT_LENGTH = 4096;
        const chunks = [];
        let segIdx = 0;
        for (let offset = 0; offset < encryptedData.length; offset += SEGMENT_LENGTH) {
            const segment = encryptedData.slice(offset, offset + SEGMENT_LENGTH);
            const iv = sha512(concatUint8(keyDataSalt, le32(segIdx))).slice(0, keyDataBlockSize);
            const dec = aesCbcDecryptNoPad(secretKey, iv, segment);
            chunks.push(dec);
            segIdx++;
        }
        return concatUint8(...chunks).slice(0, totalSize);
    }
